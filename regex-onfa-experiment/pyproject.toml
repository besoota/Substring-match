[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onfa-regex-experiment"
version = "0.1.0"
description = "ONFA substring-matching implementation and linear-scaling experiment"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.2,<2",
]

[project.optional-dependencies]
experiment = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
]
test = [
    "pytest>=7.4,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

